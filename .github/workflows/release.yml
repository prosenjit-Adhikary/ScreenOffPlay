name: Signed Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag already reachable from main (for example v1.3.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Select release tag
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RELEASE_TAG" ]; then
            RELEASE_TAG="$INPUT_RELEASE_TAG"
          else
            RELEASE_TAG="${PUSH_REF#refs/tags/}"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Checkout tagged source with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Require tag to be part of main and match app version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Refusing release: tagged commit is not reachable from main"
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          APP_VERSION="$(sed -nE 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' app/build.gradle | head -n 1)"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match app version ($APP_VERSION)"
            exit 1
          fi
          grep -Fq '<string name="app_name">SofP</string>' app/src/main/res/values/strings.xml
          if grep -Eq 'android:accessibilityEventTypes=|android:packageNames=|canRetrieveWindowContent="true"' app/src/main/res/xml/accessibility_service_config.xml; then
            echo "::error::Accessibility configuration exceeds the approved no-event/no-content scope"
            exit 1
          fi
          grep -Fq 'android:canRetrieveWindowContent="false"' app/src/main/res/xml/accessibility_service_config.xml
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite published assets"
            exit 1
          fi

      - name: Require release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 34 and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Decode and validate maintainer keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          raw = "".join(os.environ["KEYSTORE_B64"].split())
          try:
              data = base64.b64decode(raw, validate=True)
          except Exception:
              raise SystemExit("::error::ANDROID_KEYSTORE_BASE64 is not valid complete Base64.")
          if not data:
              raise SystemExit("::error::Decoded keystore is empty.")
          pathlib.Path(os.environ["RUNNER_TEMP"], "screenoffplay-release.jks").write_bytes(data)
          PY
          keytool -list -keystore "$RUNNER_TEMP/screenoffplay-release.jks" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/screenoffplay-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean lint test assembleRelease

      - name: Run dependency-free Accessibility settings regression tests
        run: |
          set -euo pipefail
          TEST_CLASSES="$RUNNER_TEMP/sofP-unit-tests"
          mkdir -p "$TEST_CLASSES"
          javac -d "$TEST_CLASSES" \
            app/src/main/java/com/minimal/screenoff/AccessibilitySettingsMatcher.java \
            app/src/test/java/com/minimal/screenoff/AccessibilitySettingsMatcherTest.java
          java -cp "$TEST_CLASSES" com.minimal.screenoff.AccessibilitySettingsMatcherTest

      - name: Verify APK permissions, signature and checksum
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ACTUAL_PERMISSIONS="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$APK" | awk -F"'" '/uses-permission: name=/{print $2}' | sort -u)"
          EXPECTED_PERMISSIONS="$(printf 'android.permission.WAKE_LOCK\n' | sort)"
          if [[ "$ACTUAL_PERMISSIONS" != "$EXPECTED_PERMISSIONS" ]]; then
            echo "::error::Unexpected permissions in signed release APK"
            printf 'Expected:\n%s\nActual:\n%s\n' "$EXPECTED_PERMISSIONS" "$ACTUAL_PERMISSIONS"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > app-release.apk.sha256

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          gh release create "$RELEASE_TAG" "$APK" app-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "SofP $RELEASE_TAG" \
            --generate-notes
