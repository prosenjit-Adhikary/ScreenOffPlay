name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK Platform 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - run: gradle lint
      - run: gradle test
      - run: gradle assembleDebug
      - run: gradle assembleRelease
      - name: Enforce minimal permissions and Accessibility privacy policy
        run: |
          set -euo pipefail
          expected_permissions="$(printf 'android.permission.WAKE_LOCK\n' | sort)"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            actual_permissions="$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$apk" | awk -F"'" '/uses-permission: name=/{print $2}' | sort -u)"
            if [[ "$actual_permissions" != "$expected_permissions" ]]; then
              echo "::error::Unexpected requested permissions in $apk"
              printf 'Expected:\n%s\nActual:\n%s\n' "$expected_permissions" "$actual_permissions"
              exit 1
            fi
          done
          manifest="app/src/main/AndroidManifest.xml"
          if grep -Eq 'BIND_DEVICE_ADMIN|DeviceAdminReceiver|SYSTEM_ALERT_WINDOW|BIND_ACCESSIBILITY_SERVICE' "$manifest"; then
            echo "::error::Unexpected legacy permission or declaration"
            exit 1
          fi
          grep -Fq 'android:name=".ScreenLockAccessibilityService"' "$manifest"
          grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' "$manifest"
          grep -Fq 'android:canRetrieveWindowContent="false"' app/src/main/res/xml/accessibility_service_config.xml
          if grep -Eq 'canRetrieveWindowContent="true"|canRequestTouchExplorationMode="true"|canRequestFilterKeyEvents="true"' app/src/main/res/xml/accessibility_service_config.xml; then
            echo "::error::Accessibility requests capabilities outside approved scope"
            exit 1
          fi
          if grep -R -Eq 'DeviceAdmin|force-lock|lockNow\(|SYSTEM_ALERT_WINDOW|TYPE_APPLICATION_OVERLAY' app/src/main; then
            echo "::error::Legacy Device Admin or overlay implementation remains"
            exit 1
          fi
          grep -Fq '<string name="app_name">SofP</string>' app/src/main/res/values/strings.xml
      - uses: actions/upload-artifact@v4
        with:
          name: SofP-v1.3.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SofP-v1.3.0-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Smoke-test release signing with an ephemeral CI-only key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ci-test-release.jks
          ANDROID_STORE_PASSWORD: ci-only-store-password
          ANDROID_KEY_ALIAS: ci-test
          ANDROID_KEY_PASSWORD: ci-only-key-password
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$ANDROID_KEYSTORE_PATH" -storetype JKS -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -keypass "$ANDROID_KEY_PASSWORD" -dname "CN=SofP CI Signing Test" -keyalg RSA -keysize 2048 -validity 2
          gradle clean assembleRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
