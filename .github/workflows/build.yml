name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK Platform 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Install Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Run Android lint
        run: gradle lint
      - name: Run unit tests
        run: gradle test
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Build release APK (unsigned validation build)
        run: gradle assembleRelease
      - name: Smoke-test release signing with an ephemeral CI-only key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ci-test-release.jks
          ANDROID_STORE_PASSWORD: ci-only-store-password
          ANDROID_KEY_ALIAS: ci-test
          ANDROID_KEY_PASSWORD: ci-only-key-password
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -dname "CN=ScreenOffPlay CI Signing Test" \
            -keyalg RSA -keysize 2048 -validity 2
          gradle clean assembleRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenOffPlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenOffPlay-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
